[workspace]
resolver = "2"
members = [
    "uniffi-russh",
    "uniffi-bindgen",
    "uniffi-bindgen-swift",
]

# Shared uniffi version — must satisfy the `uniffi` requirement of the
# `uniffi-bindgen-react-native` version pinned in ../package.json (0.31.0-6 needs `=0.31`).
# Bumping this needs to land alongside that bump.
[workspace.dependencies]
uniffi = "=0.31.0"
